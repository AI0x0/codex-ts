name: Publish @ai0x0/codex-ts

on:
  push:
    tags:
      # Trigger on tags like codex-ts/v0.1.0
      - "codex-ts/v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + test only, skip publish)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter "@ai0x0/codex-ts" test

      - name: Build
        run: pnpm --filter "@ai0x0/codex-ts" build

      # Extract version from tag (codex-ts/v0.1.0 → 0.1.0)
      - name: Resolve version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/codex-ts/v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PKG=$(node -p "require('./codex-ts/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        working-directory: codex-ts
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
